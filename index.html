<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>희수 캘린더</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="희수 캘린더">
<meta name="theme-color" content="#FBF8F3">
<link rel="apple-touch-icon" href="/flat_cute_mustard.png">
<link rel="icon" href="/flat_cute_mustard.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF8F3;
    --paper-raised:#FFFFFF;
    --ink:#2B2A28;
    --ink-soft:#6B6560;
    --muted:#B3ACA3;
    --line:#EDE6DB;
    --heesu:#F0868F;
    --heesu-soft:#FCE3E5;
    --bf:#5B93C4;
    --bf-soft:#DEEBF6;
    --pill:#B48FCB;
    --pill-soft:#F0E4F6;
    --coral:#C6564A;
    --off:#4F9A63;
    --unread:#3FAE63;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    min-height:100vh;
    overscroll-behavior-y:none;
  }
  .app{
    max-width:480px;
    margin:0 auto;
    padding:calc(20px + env(safe-area-inset-top)) 16px 100px;
    min-height:100vh;
  }

  header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
  h1{ font-size:19px; font-weight:700; margin:0; letter-spacing:-0.01em; }
  .header-icons{ display:flex; gap:6px; }
  .icon-btn{
    width:34px; height:34px; border-radius:10px; border:1px solid var(--line);
    background:var(--paper-raised); display:flex; align-items:center; justify-content:center;
    cursor:pointer; font-size:16px;
  }
  .sync-row{ font-size:11.5px; color:var(--muted); margin-bottom:16px; display:flex; align-items:center; gap:5px; }
  .sync-row .dot{ width:6px; height:6px; border-radius:50%; background:#7BAE8F; }
  .sync-row.offline .dot{ background:var(--coral); }
  .sync-row.syncing .dot{ background:var(--pill); }

  .legend{ display:flex; gap:14px; font-size:11.5px; color:var(--ink-soft); margin-bottom:14px; flex-wrap:wrap; }
  .legend span{ display:inline-flex; align-items:center; gap:5px; }
  .legend .sw{ width:9px; height:9px; border-radius:50%; display:inline-block; }

  .month-nav{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:12px;
  }
  .month-title{ font-size:17px; font-weight:700; }
  .nav-btns{ display:flex; gap:6px; align-items:center; }
  .nav-btn{
    width:32px; height:32px; border-radius:9px; border:1px solid var(--line);
    background:var(--paper-raised); cursor:pointer; font-size:15px; color:var(--ink-soft);
    display:flex; align-items:center; justify-content:center;
  }
  .today-btn{
    font-size:12px; font-weight:650; color:var(--heesu); background:var(--heesu-soft);
    border:none; border-radius:8px; padding:6px 10px; cursor:pointer;
  }

  .cal-wrap{ touch-action: pan-y; user-select:none; }
  .weekday-row{ display:grid; grid-template-columns:repeat(7,1fr); margin-bottom:4px; }
  .weekday-row div{ text-align:center; font-size:11px; font-weight:650; color:var(--muted); padding:4px 0; }
  .weekday-row div:first-child{ color:var(--heesu); }
  .weekday-row div:last-child{ color:var(--bf); }
  .carousel{ overflow:hidden; width:100%; }
  .months-track{ display:flex; width:500%; transform:translateX(-40%); }
  .months-track.animating{ transition:transform .30s cubic-bezier(.25,.7,.4,1); }
  .month-panel{ flex:0 0 20%; max-width:20%; min-width:0; }

  .grid{ display:grid; grid-template-columns:repeat(7,1fr); grid-auto-rows:1fr; gap:3px; }
  .cell{
    position:relative;
    z-index:0;
    background:var(--paper-raised);
    border-radius:11px;
    min-height:52px;
    padding:5px 4px 4px;
    cursor:pointer;
    border:1.5px solid transparent;
    display:flex; flex-direction:column; align-items:center;
  }
  .cell.outside{ opacity:0.32; }
  .cell.pillday{ background:var(--pill-soft); }
  /* 복용 첫날 / 휴약 첫날 표시 (글자 없이 기호로만) */
  .cell.pill-start{ box-shadow:inset 0 0 0 2px var(--pill); }
  .cell.rest-start{ box-shadow:inset 0 0 0 2px rgba(180,143,203,0.5); }
  .cell.pill-start::after, .cell.rest-start::after{
    position:absolute; top:3px; right:3px; width:15px; height:15px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:9px; line-height:1; font-weight:700;
  }
  .cell.pill-start::after{ content:'★'; background:var(--pill); color:#fff; }
  .cell.rest-start::after{ content:'☾'; background:#fff; color:var(--pill); border:1.5px solid var(--pill); font-size:10px; }
  /* 완수 휴무일: 성긴 초록 빗금 (배경 아래 레이어라 다른 표시와 안 겹침) */
  .cell.dayoff::before{
    content:''; position:absolute; inset:0; border-radius:inherit; z-index:-1;
    background-image:repeating-linear-gradient(45deg, var(--off) 0 1.5px, transparent 1.5px 9px);
    opacity:.38;
  }
  .cell.pick-add{ outline:2px solid var(--bf); outline-offset:-2px; }
  .cell.pick-remove{ outline:2px dashed var(--coral); outline-offset:-2px; }
  .cell.pick-remove::before{ opacity:.15; }
  /* 상대가 아직 확인 안 한 일정이 있는 날 */
  .unread-dot{
    position:absolute; top:3px; left:3px; width:7px; height:7px; border-radius:50%;
    background:var(--unread); box-shadow:0 0 0 1.5px var(--paper-raised);
  }
  .cell.today{ border-color:var(--heesu); }
  .cell.holiday{ border-color:#E24A4A; }
  .cell.holiday .num{ color:#E24A4A; }
  .cell.selected{ background:var(--heesu-soft); }
  .cell .num{ font-size:12.5px; font-weight:600; }
  .cell.sunday .num{ color:var(--heesu); }
  .cell.saturday .num{ color:var(--bf); }
  .dots{ display:flex; gap:3px; margin-top:4px; flex-wrap:wrap; justify-content:center; }
  .dots .d{ width:8px; height:8px; border-radius:50%; }
  .dots .more{ font-size:8.5px; color:var(--muted); font-weight:650; }

  .agenda{ margin-top:22px; }
  .agenda-header{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:10px; }
  .agenda-date{ font-size:14.5px; font-weight:700; }
  .agenda-empty{ font-size:13px; color:var(--muted); padding:18px 4px; text-align:center; }
  .agenda-item{
    display:flex; align-items:flex-start; gap:10px; padding:10px 2px;
    border-bottom:1px solid var(--line);
  }
  .agenda-item .sw{ width:9px; height:9px; border-radius:50%; margin-top:4px; flex-shrink:0; }
  .agenda-item .info{ flex:1; min-width:0; }
  .agenda-item .title{ font-size:14px; font-weight:600; }
  .agenda-item .meta{ font-size:11.5px; color:var(--muted); margin-top:2px; }
  .agenda-item .del{
    background:none; border:none; color:var(--muted); cursor:pointer; padding:3px; border-radius:6px;
  }
  .agenda-item .del:hover{ color:var(--coral); background:#FBECEA; }
  .confirm-check{ flex-shrink:0; display:flex; align-items:center; cursor:pointer; margin-top:2px; }
  .confirm-check input{ display:none; }
  .confirm-check span{
    width:18px; height:18px; border-radius:6px; border:1.5px solid var(--line);
    background:var(--paper-raised); display:flex; align-items:center; justify-content:center; position:relative;
  }
  .confirm-check input:checked + span{ background:var(--off); border-color:var(--off); }
  .confirm-check input:checked + span::after{
    content:''; width:9px; height:6px; border-left:2px solid #fff; border-bottom:2px solid #fff;
    transform:rotate(-45deg) translate(1px,-1px);
  }
  .pick-bar{
    display:none; align-items:center; justify-content:space-between; gap:10px;
    background:rgba(79,154,99,0.1); border:1px solid rgba(79,154,99,0.35); color:var(--off);
    border-radius:10px; padding:9px 12px; margin-bottom:12px; font-size:12px; font-weight:650;
  }
  .pick-bar.show{ display:flex; }
  .pick-bar-btns{ display:flex; gap:6px; flex-shrink:0; }
  .btn-sm{ font-family:inherit; font-size:12px; font-weight:650; padding:7px 12px; border-radius:8px; border:none; cursor:pointer; }
  .btn-sm.cancel{ background:#fff; color:var(--ink-soft); border:1px solid var(--line); }
  .btn-sm.save{ background:var(--off); color:#fff; }

  .fab{
    position:fixed; right:20px; bottom:28px;
    width:54px; height:54px; border-radius:50%;
    background:var(--heesu); color:#fff; font-size:26px; font-weight:400;
    border:none; box-shadow:0 6px 16px rgba(240,134,143,0.45);
    cursor:pointer; display:flex; align-items:center; justify-content:center;
    line-height:1; z-index:20;
  }

  .sheet-overlay{
    position:fixed; inset:0; background:rgba(30,26,24,0.32);
    display:none; align-items:flex-end; justify-content:center; z-index:30;
  }
  .sheet-overlay.show{ display:flex; }
  .sheet{
    background:var(--paper); width:100%; max-width:480px;
    border-radius:20px 20px 0 0; padding:20px 18px calc(24px + env(safe-area-inset-bottom));
  }
  .sheet h3{ font-size:16px; font-weight:700; margin:0 0 16px; }
  .field-label{ font-size:12px; font-weight:650; color:var(--ink-soft); margin:14px 0 6px; }
  .sheet input[type=text], .sheet input[type=date], .sheet input[type=time], .sheet input[type=number]{
    width:100%; font-family:inherit; font-size:15px; font-weight:500;
    padding:11px 12px; border:1.5px solid var(--line); border-radius:10px;
    background:var(--paper-raised); color:var(--ink); outline:none;
  }
  .sheet input:focus{ border-color:var(--heesu); }
  .toggle-row{ display:flex; gap:8px; }
  .toggle-btn{
    flex:1; font-family:inherit; font-size:13.5px; font-weight:650;
    padding:10px; border-radius:10px; border:1.5px solid var(--line);
    background:var(--paper-raised); color:var(--ink-soft); cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .toggle-btn .sw{ width:8px; height:8px; border-radius:50%; }
  .toggle-btn.selected.heesu{ background:var(--heesu-soft); border-color:var(--heesu); color:var(--coral); }
  .toggle-btn.selected.bf{ background:var(--bf-soft); border-color:var(--bf); color:#2E5C82; }
  .time-toggle{ display:flex; align-items:center; gap:8px; margin-top:14px; }
  .time-toggle label{ font-size:13px; color:var(--ink-soft); font-weight:600; }
  .sheet-btns{ display:flex; gap:8px; margin-top:20px; }
  .btn{
    flex:1; font-family:inherit; font-size:14.5px; font-weight:650; padding:13px;
    border-radius:11px; border:none; cursor:pointer;
  }
  .btn.primary{ background:var(--heesu); color:#fff; }
  .btn.ghost{ background:var(--paper-raised); color:var(--ink-soft); border:1.5px solid var(--line); }
  .btn.danger{ background:#FBECEA; color:var(--coral); }

  .pill-modal .row2{ display:flex; gap:10px; }
  .pill-modal .row2 > div{ flex:1; }
  .pill-info{ font-size:12px; color:var(--ink-soft); background:var(--pill-soft); padding:10px 12px; border-radius:10px; margin-top:10px; line-height:1.5; }

  .toast{
    position:fixed; bottom:96px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:var(--paper); font-size:13px; font-weight:500; padding:10px 16px;
    border-radius:8px; opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease; z-index:40;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  .loading-state{ text-align:center; padding:60px 20px; color:var(--muted); font-size:13.5px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>희수 캘린더</h1>
    <div class="header-icons">
      <button class="icon-btn" id="dayoffBtn" title="완수 휴무일 설정">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <rect x="3.5" y="3.5" width="17" height="17" rx="5" stroke="var(--off)" stroke-width="1.7"/>
          <path d="M7.5 16.5l9-9M12 16.5l4.5-4.5" stroke="var(--off)" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
      </button>
      <button class="icon-btn" id="pillBtn" title="피임약 주기 설정">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M12 20.5c-.3 0-.6-.1-.8-.3C7.9 17.6 3 13.9 3 9.6 3 6.5 5.4 4 8.4 4c1.6 0 3.1.8 4.1 2 1-1.2 2.5-2 4.1-2 3 0 5.4 2.5 5.4 5.6 0 4.3-4.9 8-8.2 10.6-.2.2-.5.3-.8.3z" fill="var(--pill)"/>
        </svg>
      </button>
    </div>
  </header>
  <div class="pick-bar" id="pickBar">
    <span id="pickCount">완수 휴무일 선택 중 · 0일 선택됨</span>
    <div class="pick-bar-btns">
      <button class="btn-sm cancel" id="pickCancel">취소</button>
      <button class="btn-sm save" id="pickSaveBtn">저장</button>
    </div>
  </div>
  <div class="sync-row" id="syncRow"><span class="dot"></span><span id="syncLabel">동기화됨</span></div>
  <div class="legend">
    <span><span class="sw" style="background:var(--heesu)"></span>희</span>
    <span><span class="sw" style="background:var(--bf)"></span>완수</span>
  </div>

  <div id="mainContent"><div class="loading-state">불러오는 중…</div></div>
</div>

<button class="fab" id="fabAdd">+</button>

<div class="sheet-overlay" id="addOverlay">
  <div class="sheet">
    <h3>일정 추가</h3>
    <div class="field-label">날짜</div>
    <input type="date" id="evDate">
    <div class="time-toggle">
      <input type="checkbox" id="evTimeToggle">
      <label for="evTimeToggle">시간 지정</label>
    </div>
    <input type="time" id="evTime" style="margin-top:8px; display:none;">
    <div class="field-label">누구 일정인가요</div>
    <div class="toggle-row" id="personToggle">
      <button class="toggle-btn heesu" data-person="희"><span class="sw" style="background:var(--heesu)"></span>희</button>
      <button class="toggle-btn bf" data-person="완수"><span class="sw" style="background:var(--bf)"></span>완수</button>
    </div>
    <div class="field-label">내용</div>
    <input type="text" id="evTitle" placeholder="예) 저녁 약속, 병원 예약">
    <div class="sheet-btns">
      <button class="btn ghost" id="evCancel">취소</button>
      <button class="btn primary" id="evSave">저장</button>
    </div>
  </div>
</div>

<div class="sheet-overlay" id="pillOverlay">
  <div class="sheet pill-modal">
    <h3>💊 피임약 주기 설정</h3>
    <div class="field-label">복용 시작일</div>
    <input type="date" id="pillStart">
    <div class="row2">
      <div>
        <div class="field-label">복용일수</div>
        <input type="number" id="pillActive" value="21" min="1" max="90">
      </div>
      <div>
        <div class="field-label">총 주기(일)</div>
        <input type="number" id="pillCycle" value="28" min="1" max="90">
      </div>
    </div>
    <div class="pill-info">시작일부터 복용일수 만큼 매 주기마다 자동으로 달력에 표시돼요. 예: 21일 복용, 28일 주기면 21일 먹고 7일 쉬는 패턴이 계속 반복돼요.</div>
    <div class="sheet-btns">
      <button class="btn danger" id="pillClear">끄기</button>
      <button class="btn primary" id="pillSave">저장</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  const API = '/api/calendar';
  const DOW = ['일','월','화','수','목','금','토'];
  const IDENTITY_KEY = 'heesu_cal_identity';

  // 한국 공휴일 (관공서의 공휴일에 관한 규정 기준, 대체공휴일 포함). 근로자의 날은 제외.
  const KR_HOLIDAYS = new Set([
    // 2025
    '2025-01-01','2025-01-27','2025-01-28','2025-01-29','2025-01-30',
    '2025-03-01','2025-03-03','2025-05-05','2025-05-06','2025-06-03',
    '2025-06-06','2025-08-15','2025-10-03','2025-10-05','2025-10-06',
    '2025-10-07','2025-10-08','2025-10-09','2025-12-25',
    // 2026
    '2026-01-01','2026-02-16','2026-02-17','2026-02-18','2026-03-01',
    '2026-03-02','2026-05-05','2026-05-24','2026-05-25','2026-06-03',
    '2026-06-06','2026-07-17','2026-08-15','2026-08-17','2026-09-24',
    '2026-09-25','2026-09-26','2026-10-03','2026-10-05','2026-10-09',
    '2026-12-25',
    // 2027
    '2027-01-01','2027-02-06','2027-02-07','2027-02-08','2027-02-09',
    '2027-03-01','2027-05-05','2027-05-13','2027-06-06','2027-08-15',
    '2027-08-16','2027-09-14','2027-09-15','2027-09-16','2027-10-03',
    '2027-10-04','2027-10-09','2027-10-11','2027-12-25',
    // 2028
    '2028-01-01','2028-01-26','2028-01-27','2028-03-01','2028-05-05',
    '2028-06-06','2028-07-17','2028-08-15','2028-10-02','2028-10-03',
    '2028-10-04','2028-10-09','2028-12-25'
  ]);
  function isHoliday(iso){ return KR_HOLIDAYS.has(iso); }


  let data = { events: [], pill: null, dayoff: [] };
  let viewYear, viewMonth; // month: 0-11
  let realTodayY, realTodayM, realTodayD;
  let selectedDateIso = null;
  let loaded = false;

  // 완수 휴무일 다중 선택 모드
  let pickMode = false;
  let pickPending = new Map(); // iso -> 'add' | 'remove'

  const mainContent = document.getElementById('mainContent');
  const toastEl = document.getElementById('toast');
  const syncRow = document.getElementById('syncRow');
  const syncLabel = document.getElementById('syncLabel');

  function pad(n){ return n<10?'0'+n:''+n; }
  function isoOf(y,m,d){ return y+'-'+pad(m+1)+'-'+pad(d); }
  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

  function refreshRealToday(){
    const now = new Date();
    realTodayY = now.getFullYear(); realTodayM = now.getMonth(); realTodayD = now.getDate();
  }

  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastEl._t);
    toastEl._t = setTimeout(()=> toastEl.classList.remove('show'), 1600);
  }
  function setSync(state){
    syncRow.className = 'sync-row' + (state==='offline'?' offline':state==='syncing'?' syncing':'');
    syncLabel.textContent = state==='offline' ? '저장 실패 · 재시도 필요' : state==='syncing' ? '저장 중…' : '동기화됨';
  }

  async function loadRemote(){
    const res = await fetch(API, { cache:'no-store' });
    if(!res.ok) throw new Error('load failed');
    return res.json();
  }
  let saveTimer=null, saveInFlight=false, savePending=false;
  function persist(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(doSave, 150);
  }
  async function doSave(){
    if(saveInFlight){ savePending=true; return; }
    saveInFlight = true;
    setSync('syncing');
    try{
      const res = await fetch(API, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(data) });
      if(!res.ok) throw new Error();
      setSync('ok');
    }catch(e){
      setSync('offline');
      showToast('저장에 실패했어요. 인터넷을 확인해주세요.');
    }finally{
      saveInFlight = false;
      if(savePending){ savePending=false; doSave(); }
    }
  }

  function personColorVar(p){ return p==='완수' ? 'var(--bf)' : 'var(--heesu)'; }

  function isPillActiveDay(iso){
    if(!data.pill || !data.pill.startDate) return false;
    const start = new Date(data.pill.startDate+'T00:00:00');
    const d = new Date(iso+'T00:00:00');
    const diffDays = Math.floor((d - start) / 86400000);
    if(diffDays < 0) return false;
    const cyc = data.pill.cycleDays || 28;
    const act = data.pill.activeDays || 21;
    const pos = diffDays % cyc;
    return pos < act;
  }

  // 'start' = 복용 첫날, 'rest' = 휴약 첫날, null = 해당 없음
  function pillMarker(iso){
    if(!data.pill || !data.pill.startDate) return null;
    const start = new Date(data.pill.startDate+'T00:00:00');
    const d = new Date(iso+'T00:00:00');
    const diffDays = Math.round((d - start) / 86400000);
    if(diffDays < 0) return null;
    const cyc = data.pill.cycleDays || 28;
    const act = data.pill.activeDays || 21;
    const pos = diffDays % cyc;
    if(pos === 0) return 'start';
    if(pos === act && act < cyc) return 'rest';
    return null;
  }

  function isDayOff(iso){ return !!(data.dayoff && data.dayoff.includes(iso)); }

  // 아직 체크(확인) 안 한 일정이 그 날짜에 있는지 — 누가 올렸든 상관없이 둘 다 똑같이 봄
  function hasUnread(iso){
    return eventsFor(iso).some(e => e.confirmed === false);
  }

  function togglePick(iso){
    const off = isDayOff(iso);
    const cur = pickPending.get(iso);
    if(!cur){ pickPending.set(iso, off ? 'remove' : 'add'); }
    else { pickPending.delete(iso); }
    updatePickBar();
    renderTrack();
  }

  function updatePickBar(){
    const bar = document.getElementById('pickBar');
    if(!bar) return;
    bar.classList.toggle('show', pickMode);
    document.getElementById('pickCount').textContent = '완수 휴무일 선택 중 · ' + pickPending.size + '일 선택됨';
  }

  function commitPick(){
    if(!data.dayoff) data.dayoff = [];
    let changed = 0;
    pickPending.forEach((action, iso)=>{
      const idx = data.dayoff.indexOf(iso);
      if(action==='add' && idx===-1){ data.dayoff.push(iso); changed++; }
      else if(action==='remove' && idx!==-1){ data.dayoff.splice(idx,1); changed++; }
    });
    pickPending.clear();
    pickMode = false;
    persist();
    updatePickBar();
    renderTrack();
    showToast(changed ? '완수 휴무일을 반영했어요' : '변경된 내용이 없어요');
  }

  function cancelPick(){
    pickPending.clear();
    pickMode = false;
    updatePickBar();
    renderTrack();
  }

  let animating = false;

  function buildLayout(){
    mainContent.innerHTML =
      '<div class="month-nav">' +
        '<div class="month-title" id="monthTitle"></div>' +
        '<div class="nav-btns">' +
          '<button class="today-btn" id="todayBtn">오늘</button>' +
          '<button class="nav-btn" id="prevBtn">‹</button>' +
          '<button class="nav-btn" id="nextBtn">›</button>' +
        '</div>' +
      '</div>' +
      '<div class="cal-wrap" id="calWrap">' +
        '<div class="weekday-row">' + DOW.map(d=>'<div>'+d+'</div>').join('') + '</div>' +
        '<div class="carousel"><div class="months-track" id="track"></div></div>' +
      '</div>' +
      '<div class="agenda" id="agenda"></div>';

    document.getElementById('prevBtn').onclick = ()=> slideTo(-1);
    document.getElementById('nextBtn').onclick = ()=> slideTo(1);
    document.getElementById('todayBtn').onclick = ()=>{
      refreshRealToday();
      viewYear = realTodayY; viewMonth = realTodayM;
      selectedDateIso = isoOf(realTodayY, realTodayM, realTodayD);
      renderTrack();
    };

    const calWrap = document.getElementById('calWrap');
    let touchStartX=0, touchStartY=0, touching=false;
    calWrap.addEventListener('touchstart', e=>{
      touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY; touching=true;
    }, {passive:true});
    calWrap.addEventListener('touchend', e=>{
      if(!touching) return; touching=false;
      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = e.changedTouches[0].clientY - touchStartY;
      if(Math.abs(dx) > 46 && Math.abs(dx) > Math.abs(dy)*1.4){
        if(dx < 0) slideTo(1);   // 손가락을 왼쪽으로 밀면 -> 다음달 (오른쪽에서 슬라이드)
        else slideTo(-1);         // 손가락을 오른쪽으로 밀면 -> 이전달 (왼쪽에서 슬라이드)
      }
    }, {passive:true});

    renderTrack();
  }

  function addMonths(y, m, delta){
    let nm = m + delta;
    let ny = y;
    while(nm > 11){ nm -= 12; ny++; }
    while(nm < 0){ nm += 12; ny--; }
    return { y: ny, m: nm };
  }

  function slideTo(direction){
    if(animating) return;
    animating = true;
    const track = document.getElementById('track');
    track.classList.add('animating');
    const targetPct = -40 + direction*(-20); // direction 1(next)->-60%, -1(prev)->-20%
    track.style.transform = 'translateX(' + targetPct + '%)';
    setTimeout(()=>{
      const next = addMonths(viewYear, viewMonth, direction);
      viewYear = next.y; viewMonth = next.m;
      renderTrack(true);
      animating = false;
    }, 300);
  }

  function eventsFor(iso){
    return data.events.filter(e=>e.date===iso).sort((a,b)=>{
      if(a.time && b.time) return a.time < b.time ? -1 : 1;
      if(a.time) return -1;
      if(b.time) return 1;
      return 0;
    });
  }

  function buildMonthGrid(y, m){
    const grid = document.createElement('div');
    grid.className = 'grid';

    const firstOfMonth = new Date(y, m, 1);
    const startWeekday = firstOfMonth.getDay();
    const daysInThisMonth = new Date(y, m+1, 0).getDate();
    const daysInPrevMonth = new Date(y, m, 0).getDate();

    const cells = [];
    for(let i=0;i<startWeekday;i++){
      const dnum = daysInPrevMonth - startWeekday + 1 + i;
      const py = m===0 ? y-1 : y;
      const pm = m===0 ? 11 : m-1;
      cells.push({ y:py, m:pm, d:dnum, outside:true });
    }
    for(let d=1; d<=daysInThisMonth; d++){
      cells.push({ y, m, d, outside:false });
    }
    while(cells.length % 7 !== 0 || cells.length < 42){
      const last = cells[cells.length-1];
      const nd = new Date(last.y, last.m, last.d+1);
      cells.push({ y:nd.getFullYear(), m:nd.getMonth(), d:nd.getDate(), outside:true });
    }

    cells.forEach((c, idx)=>{
      const iso = isoOf(c.y, c.m, c.d);
      const wd = idx % 7;
      const isToday = c.y===realTodayY && c.m===realTodayM && c.d===realTodayD;
      const isSelected = iso === selectedDateIso;
      const evs = eventsFor(iso);
      const pillActive = isPillActiveDay(iso);
      const holiday = isHoliday(iso);
      const marker = pillMarker(iso);
      const pending = pickMode ? pickPending.get(iso) : undefined;
      const off = isDayOff(iso) && pending !== 'remove';
      const unread = hasUnread(iso);

      const cell = document.createElement('div');
      cell.className = 'cell' +
        (c.outside?' outside':'') +
        (isToday?' today':'') +
        (isSelected?' selected':'') +
        (wd===0?' sunday':'') + (wd===6?' saturday':'') +
        (pillActive?' pillday':'') +
        (marker==='start'?' pill-start':'') +
        (marker==='rest'?' rest-start':'') +
        (holiday?' holiday':'') +
        (off?' dayoff':'') +
        (pending==='add'?' pick-add':'') +
        (pending==='remove'?' pick-remove':'');
      cell.innerHTML = '<span class="num">'+c.d+'</span>';

      if(unread){
        const ud = document.createElement('span');
        ud.className = 'unread-dot';
        ud.title = '아직 확인 안 한 일정이 있어요';
        cell.appendChild(ud);
      }

      if(evs.length){
        const dotsWrap = document.createElement('div');
        dotsWrap.className = 'dots';
        evs.slice(0,3).forEach(e=>{
          const dd = document.createElement('span');
          dd.className = 'd';
          dd.style.background = personColorVar(e.person);
          dotsWrap.appendChild(dd);
        });
        if(evs.length > 3){
          const more = document.createElement('span');
          more.className = 'more';
          more.textContent = '+'+(evs.length-3);
          dotsWrap.appendChild(more);
        }
        cell.appendChild(dotsWrap);
      }

      cell.onclick = ()=>{
        if(pickMode){ togglePick(iso); return; }
        selectedDateIso = iso; renderTrack();
      };
      grid.appendChild(cell);
    });

    return grid;
  }

  function renderTrack(skipTransitionReset){
    document.getElementById('monthTitle').textContent = viewYear + '년 ' + (viewMonth+1) + '월';
    const track = document.getElementById('track');
    track.classList.remove('animating');
    track.innerHTML = '';
    for(let off=-2; off<=2; off++){
      const mm = addMonths(viewYear, viewMonth, off);
      const panel = document.createElement('div');
      panel.className = 'month-panel';
      panel.appendChild(buildMonthGrid(mm.y, mm.m));
      track.appendChild(panel);
    }
    // snap instantly back to the centered (index 2) position, no animation
    track.style.transform = 'translateX(-40%)';
    renderAgenda();
  }
  const renderCalendar = renderTrack;

  function renderAgenda(){
    const agenda = document.getElementById('agenda');
    if(!selectedDateIso){ agenda.innerHTML = ''; return; }
    const d = new Date(selectedDateIso+'T00:00:00');
    const label = (d.getMonth()+1)+'월 '+d.getDate()+'일 '+DOW[d.getDay()]+'요일';
    const evs = eventsFor(selectedDateIso);

    let html = '<div class="agenda-header"><div class="agenda-date">'+label+'</div></div>';
    if(evs.length===0){
      html += '<div class="agenda-empty">이 날은 일정이 없어요</div>';
    } else {
      evs.forEach(e=>{
        html += '<div class="agenda-item">' +
          '<span class="sw" style="background:'+personColorVar(e.person)+'"></span>' +
          '<div class="info"><div class="title">'+escapeHtml(e.title)+'</div>' +
          '<div class="meta">'+e.person + (e.time ? ' · '+e.time : '')+'</div></div>' +
          '<label class="confirm-check" title="상대가 확인했어요">' +
            '<input type="checkbox" data-id="'+e.id+'" '+(e.confirmed?'checked':'')+'><span></span>' +
          '</label>' +
          '<button class="del" data-id="'+e.id+'">✕</button>' +
          '</div>';
      });
    }
    agenda.innerHTML = html;
    agenda.querySelectorAll('.del').forEach(btn=>{
      btn.onclick = ()=>{
        data.events = data.events.filter(x=>x.id!==btn.dataset.id);
        persist(); renderCalendar();
      };
    });
    agenda.querySelectorAll('.confirm-check input').forEach(cb=>{
      cb.onchange = ()=>{
        const ev = data.events.find(x=>x.id===cb.dataset.id);
        if(!ev) return;
        ev.confirmed = cb.checked;
        persist(); renderCalendar();
      };
    });
  }

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  /* ---------- add event sheet ---------- */
  const addOverlay = document.getElementById('addOverlay');
  const evDate = document.getElementById('evDate');
  const evTimeToggle = document.getElementById('evTimeToggle');
  const evTime = document.getElementById('evTime');
  const evTitle = document.getElementById('evTitle');
  const personToggle = document.getElementById('personToggle');
  let selPerson = localStorage.getItem(IDENTITY_KEY) || '희';

  function openAddSheet(){
    evDate.value = selectedDateIso || isoOf(realTodayY, realTodayM, realTodayD);
    evTimeToggle.checked = false;
    evTime.style.display = 'none';
    evTime.value = '';
    evTitle.value = '';
    setPersonSelected(selPerson);
    addOverlay.classList.add('show');
    setTimeout(()=> evTitle.focus(), 50);
  }
  function closeAddSheet(){ addOverlay.classList.remove('show'); }

  function setPersonSelected(p){
    selPerson = p;
    personToggle.querySelectorAll('.toggle-btn').forEach(b=>{
      b.classList.toggle('selected', b.dataset.person===p);
    });
  }
  personToggle.querySelectorAll('.toggle-btn').forEach(b=>{
    b.onclick = ()=> setPersonSelected(b.dataset.person);
  });
  evTimeToggle.onchange = ()=>{ evTime.style.display = evTimeToggle.checked ? 'block' : 'none'; };

  document.getElementById('fabAdd').onclick = openAddSheet;
  document.getElementById('evCancel').onclick = closeAddSheet;
  addOverlay.onclick = (e)=>{ if(e.target===addOverlay) closeAddSheet(); };
  evTitle.addEventListener('keydown', e=>{ if(e.key==='Enter') saveEvent(); });

  function saveEvent(){
    const title = evTitle.value.trim();
    if(!title){ evTitle.focus(); return; }
    if(!evDate.value) return;
    localStorage.setItem(IDENTITY_KEY, selPerson);
    data.events.push({
      id: uid(),
      date: evDate.value,
      time: evTimeToggle.checked && evTime.value ? evTime.value : null,
      title,
      person: selPerson,
      createdAt: Date.now(),
      confirmed: false
    });
    persist();
    selectedDateIso = evDate.value;
    closeAddSheet();
    renderCalendar();
  }
  document.getElementById('evSave').onclick = saveEvent;

  /* ---------- pill settings sheet ---------- */
  const pillOverlay = document.getElementById('pillOverlay');
  const pillStart = document.getElementById('pillStart');
  const pillActive = document.getElementById('pillActive');
  const pillCycle = document.getElementById('pillCycle');

  document.getElementById('pillBtn').onclick = ()=>{
    if(data.pill && data.pill.startDate){
      pillStart.value = data.pill.startDate;
      pillActive.value = data.pill.activeDays || 21;
      pillCycle.value = data.pill.cycleDays || 28;
    } else {
      pillStart.value = isoOf(realTodayY, realTodayM, realTodayD);
      pillActive.value = 21;
      pillCycle.value = 28;
    }
    pillOverlay.classList.add('show');
  };
  pillOverlay.onclick = (e)=>{ if(e.target===pillOverlay) pillOverlay.classList.remove('show'); };
  document.getElementById('pillSave').onclick = ()=>{
    if(!pillStart.value) return;
    data.pill = {
      startDate: pillStart.value,
      activeDays: parseInt(pillActive.value,10) || 21,
      cycleDays: parseInt(pillCycle.value,10) || 28
    };
    persist();
    pillOverlay.classList.remove('show');
    renderCalendar();
    showToast('피임약 주기를 저장했어요');
  };
  document.getElementById('pillClear').onclick = ()=>{
    data.pill = null;
    persist();
    pillOverlay.classList.remove('show');
    renderCalendar();
    showToast('피임약 표시를 껐어요');
  };

  /* ---------- 완수 휴무일 다중 선택 ---------- */
  document.getElementById('dayoffBtn').onclick = ()=>{
    pickMode = !pickMode;
    if(!pickMode) pickPending.clear();
    updatePickBar();
    renderTrack();
    if(pickMode) showToast('날짜를 여러 개 눌러서 고른 뒤 저장하세요');
  };
  document.getElementById('pickCancel').onclick = cancelPick;
  document.getElementById('pickSaveBtn').onclick = commitPick;

  /* ---------- init & rollover ---------- */
  async function init(){
    refreshRealToday();
    viewYear = realTodayY; viewMonth = realTodayM;
    selectedDateIso = isoOf(realTodayY, realTodayM, realTodayD);
    try{
      data = await loadRemote();
      if(!data.events) data.events = [];
      if(!data.dayoff) data.dayoff = [];
    }catch(e){
      data = { events: [], pill: null, dayoff: [] };
      setSync('offline');
      showToast('데이터를 불러오지 못했어요. 새로고침해보세요.');
    }
    buildLayout();
    renderCalendar();
    loaded = true;
  }

  let lastRealMonthKey = null;
  function monthKey(){ return realTodayY+'-'+realTodayM; }

  setInterval(async ()=>{
    const prevKey = monthKey();
    refreshRealToday();
    if(monthKey() !== prevKey){
      // real month changed while app stayed open — follow along if user was on "today"
      if(viewYear===parseInt(prevKey.split('-')[0]) && viewMonth===parseInt(prevKey.split('-')[1])){
        viewYear = realTodayY; viewMonth = realTodayM;
      }
      renderCalendar();
    }
  }, 60000);

  document.addEventListener('visibilitychange', async ()=>{
    if(document.visibilityState==='visible' && loaded){
      refreshRealToday();
      try{ data = await loadRemote(); if(!data.events) data.events=[]; if(!data.dayoff) data.dayoff=[]; renderCalendar(); setSync('ok'); }
      catch(e){ setSync('offline'); }
    }
  });

  init();
})();
</script>
</body>
